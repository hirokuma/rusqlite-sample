[package]
name = "rusqlite-sample"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitcoin = { version = "0.32.102", features = ["rand-std"] }
hex = "0.4.3"
rusqlite = { version = "0.43.0", features = ["time"] }
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
